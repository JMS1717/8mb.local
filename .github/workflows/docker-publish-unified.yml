name: docker-publish-unified

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            dockerfile: ./Dockerfile
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./Dockerfile.arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: vars
        run: |
          # VERSION is the single source of truth for active application versions.
          APP_VERSION=$(tr -d '\r\n ' < VERSION)
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a full four-part version; got '$APP_VERSION'" >&2
            exit 1
          fi
          BUILD_TIMESTAMP=$(date -u +%FT%TZ)
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          SHA_TAG=sha-${GITHUB_SHA::7}
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
            echo "stable_tag=v${APP_VERSION}" >> $GITHUB_OUTPUT
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "ref_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Verify version synchronization
        shell: pwsh
        run: ./scripts/check-version.ps1 -RepositoryRoot $PWD

      - name: Prepare tag list
        id: taglist
        run: |
          IMAGE="jms1717/8mblocal"
          TAGS="$IMAGE:${{ steps.vars.outputs.sha_tag }}"
          if [[ -n "${{ steps.vars.outputs.latest_tag }}" ]]; then TAGS="$TAGS\n$IMAGE:${{ steps.vars.outputs.latest_tag }}"; fi
          if [[ -n "${{ steps.vars.outputs.stable_tag }}" ]]; then TAGS="$TAGS\n$IMAGE:${{ steps.vars.outputs.stable_tag }}"; fi
          if [[ -n "${{ steps.vars.outputs.ref_tag }}" ]]; then TAGS="$TAGS\n$IMAGE:${{ steps.vars.outputs.ref_tag }}"; fi
          {
            echo "tags<<EOF"
            echo -e "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # This is deliberately a non-publishing compatibility gate. Publishing
      # must be performed by a future release workflow only after required
      # Windows artifacts and Store-package validation have passed.
      - name: Build native container (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.taglist.outputs.tags }}
          outputs: type=oci,dest=/tmp/8mblocal-${{ matrix.architecture }}.tar
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.app_version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.vars.outputs.build_timestamp }}

      - name: Upload native OCI image
        uses: actions/upload-artifact@v4
        with:
          name: 8mblocal-container-${{ matrix.architecture }}
          path: /tmp/8mblocal-${{ matrix.architecture }}.tar
          if-no-files-found: error
