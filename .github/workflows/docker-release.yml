name: Publish multi-architecture Docker image

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type PUBLISH to push amd64, arm64, and the combined manifest'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  publish-architecture:
    if: inputs.confirm_publish == 'PUBLISH'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "value=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            jms1717/8mblocal:${{ steps.version.outputs.value }}-${{ matrix.architecture }}
            jms1717/8mblocal:sha-${{ github.sha }}-${{ matrix.architecture }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            BUILD_COMMIT=${{ github.sha }}

  publish-manifest:
    if: inputs.confirm_publish == 'PUBLISH'
    needs: publish-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "value=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Create and verify the multi-architecture manifests
        run: |
          version='${{ steps.version.outputs.value }}'
          docker buildx imagetools create \
            --tag "jms1717/8mblocal:$version" \
            --tag jms1717/8mblocal:latest \
            "jms1717/8mblocal:$version-amd64" \
            "jms1717/8mblocal:$version-arm64"
          docker buildx imagetools inspect "jms1717/8mblocal:$version"
