name: Build native Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'VERSION'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify version synchronization
        shell: pwsh
        run: ./scripts/check-version.ps1 -RepositoryRoot $PWD
      - name: Unit tests, lint, APK, and bundle
        working-directory: android
        run: gradle test lint assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: 8mblocal-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/tests
            android/app/build/reports/lint-results-*.html
          if-no-files-found: error

  instrumented-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run API 35 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: gradle connectedDebugAndroidTest
